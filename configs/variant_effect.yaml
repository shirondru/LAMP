# Train on variant effects using the reference genome (--mode variant_effect)
experiment_name: VariantEffect
project: LAMP
seq_len: 49152
learning_rate: 5e-6
train_batch_size: 14
gradient_accumulation: 4
max_epochs: 1000
precision: bf16-mixed
tissues_to_train: "Whole_Blood"
gradient_clip_val: 0.05
patience: 50
valid_metrics_save_freq: 1
position_idx: 5 # position within the motif of the synthetic variant
train_target_r2: 0.5
valid_target_r2: 0.5
test_target_r2: 0.5
monitor: mean_pearsonrz_across_valid_genes_across_valid_donors
monitor_mode: max
n_gpus: 3

train_gene_path: ${LAMP_ROOT}/data/gene_lists/train_genes_3k.txt
valid_gene_path: ${LAMP_ROOT}/data/gene_lists/valid_genes.txt
test_gene_path: ${LAMP_ROOT}/data/gene_lists/all_blood_test_genes.txt
save_dir: ${LAMP_ROOT}/results
